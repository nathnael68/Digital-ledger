version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database (Strictly Internal, No Public Port)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: delgone_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - delgone_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - delgone_db_internal

  # ----------------------------------------------------------------------------
  # 2. FastAPI Application Engine (Gunicorn Multi-Worker ASGI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: delgone_prod_backend
    restart: always
    environment:
      ENVIRONMENT: production
      PROJECT_NAME: ${PROJECT_NAME:-Delgone Digital Sales Ledger}
      API_V1_STR: /api
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Addis_Ababa}
      APP_CURRENCY: ${APP_CURRENCY:-ETB}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delgone_db_internal
      - delgone_app_network

  # ----------------------------------------------------------------------------
  # 3. React Frontend PWA Shell (Nginx Alpine Serving Static Bundle)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: delgone_prod_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - delgone_app_network

  # ----------------------------------------------------------------------------
  # 4. Production Reverse Proxy & SSL Termination (Nginx)
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: delgone_prod_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - delgone_app_network

  # ----------------------------------------------------------------------------
  # 5. Let's Encrypt Automated Certificate Renewer (Certbot)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: delgone_prod_certbot
    restart: always
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - delgone_app_network

volumes:
  delgone_postgres_prod_data:
    name: delgone_postgres_prod_data
  certbot_www:
    name: certbot_www
  certbot_conf:
    name: certbot_conf

networks:
  delgone_db_internal:
    internal: true
    name: delgone_db_internal
  delgone_app_network:
    name: delgone_app_network
